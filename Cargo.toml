[package]
name = "auth2wd"
version = "0.1.1"
edition = "2024"

[lib]
name = "auth2wd"
path = "src/lib.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
mimalloc = { version = "0.1", features = ["secure"] }
async-trait = "0.1"
sophia = { version = "0.8", features = ["xml"] }
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde-xml-rs = "0.8"
regex = "1"
wikimisc = { git = "https://github.com/magnusmanske/wikimisc", features = [
	"date",
	"entity-id",
	"external-id",
	"http",
	"item-merger",
	"logging",
	"server",
	"statements",
	"telemetry",
	"wikibase",
	"wikidata",
] }
serde = "1"
serde_json = "1"
axum = { version = "0.8", features = [
	"http1",
	"http2",
	"tokio",
	"json",
	"macros",
] }
tracing = "0.1"
tower-http = { version = "0.7", features = ["full"] }
anyhow = "1"
futures = "0.3"

[dev-dependencies]
async-once-cell = "0.5"
serial_test = "3"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"

[profile.dev]
debug = false

[profile.release]
opt-level = 3
lto = 'fat'
codegen-units = 1
