[package]
name = "auth2wd"
version = "0.1.1"
edition = "2024"

[lib]
name = "auth2wd"
path = "src/lib.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
mimalloc = { version = "0.1", features = ["secure"] }
async-trait = "0.1"
sophia = { version = "0.8", features = ["xml"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
tokio = { version = "1", features = ["full"] }
serde-xml-rs = "0.8"
regex = "1"
url = "2"
wikimisc = { git = "https://github.com/magnusmanske/wikimisc", features = [
	"date",
	"item-merger",
	"wikibase",
] }
serde = "1"
serde_json = "1"
chrono = "0.4"
axum = { version = "0.8", features = [
	"http1",
	"http2",
	"tokio",
	"json",
	"macros",
] }
tracing = "0.1"
tracing-subscriber = "0.3"
tower-http = { version = "0.6", features = ["full"] }
anyhow = "1"
futures = "0.3"

[dev-dependencies]
async-once-cell = "0.5"
serial_test = "3"
wiremock = "0.6"

[profile.dev]
debug = false

[profile.release]
opt-level = 3
lto = 'fat'
panic = 'abort'
codegen-units = 1
